# Recipe: Qwen3.8-27B-FP8
# Official block-scaled FP8 checkpoint with the embedded MTP draft head.

recipe_version: "1"
name: Qwen3.8-27B-FP8
description: vLLM serving Qwen/Qwen3.8-27B-FP8 with native MTP speculative decoding

model: Qwen/Qwen3.8-27B-FP8
container: vllm-node

cluster_only: false
solo_only: false

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  num_speculative_tokens: 5

env: {}

command: |
  vllm serve Qwen/Qwen3.8-27B-FP8 \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --kv-cache-dtype fp8 \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --load-format fastsafetensors \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice
