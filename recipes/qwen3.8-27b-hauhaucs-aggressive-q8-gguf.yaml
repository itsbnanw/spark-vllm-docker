recipe_version: "2"
name: Qwen3.8-27B-HauhauCS-Aggressive-Q8-K-P-GGUF
description: Text chat on one DGX Spark with HauhauCS Q8_K_P GGUF and embedded MTP

model: HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF
model_file: Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-Q8_K_P.gguf
container: llama-node
container_name: llama_hauhaucs_node
build_args:
  - --llama-cpp
solo_only: true

defaults:
  host: 0.0.0.0
  port: 8000
  max_model_len: 32768

command: |
  MODEL_PATH={model_path}
  if [ ! -s "$MODEL_PATH" ]; then
    echo "Model file missing: $MODEL_PATH. Run this recipe with --setup first." >&2
    exit 1
  fi
  exec llama-server \
    --model "$MODEL_PATH" \
    --alias qwen3.8-27b-hauhaucs-aggressive-q8 \
    --host {host} \
    --port {port} \
    --ctx-size {max_model_len} \
    --n-gpu-layers 99 \
    --parallel 1 \
    --flash-attn on \
    --jinja \
    --reasoning on \
    --spec-type draft-mtp \
    --spec-draft-n-max 2
